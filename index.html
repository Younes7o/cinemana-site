function guessLang(t) {
  let han = false;

    if (c >= 0x3040 && c <= 0x30FF) return 'ja';
    if (c >= 0x4E00 && c <= 0x9FFF) han = true;
    else if (c >= 0x0E00 && c <= 0x0E7F) return 'th';
    else if (c >= 0x0900 && c <= 0x0DFF) return 'hi';
    else if (c >= 0x0600 && c <= 0x06FF) return 'ar';
    else if (c >= 0x0400 && c <= 0x04FF) return 'ru';

  $('#pcc').onclick = () => {
    const subs = (e.sub || []).slice().sort((a, b) => isAr(b.l) - isAr(a.l));
    menu('الترجمة', [{ t: 'إيقاف', on: !cur.sub, f: () => { [...vid.textTracks].forEach(t => t.mode = 'disabled'); cur.sub = ''; } }].concat(subs.map(sb => ({ t: isAr(sb.l) ? 'العربية' : (sb.l || 'ترجمة'), on: cur.sub === sb.u, f: () => applySub(sb) }))));
  };
  { const ar = (e.sub || []).find(x => isAr(x.l)); if (ar) applySub(ar); }   // العربية تُفعَّل تلقائياً إن وُجدت
}
function step(d) {
  const s = cur.s, L = s.eps.filter(e => e.raw), i = L.findIndex(e => e.id === cur.e.id) + d;
  if (i >= 0 && i < L.length) play(s.id, L[i].id); else if (d > 0) closePlayer();
}
function saveProg() {
  if (!vid || !cur.s || !isFinite(vid.duration) || vid.duration < 1) return;
  S.prog[cur.s.id] = { ep: cur.e.id, pos: vid.currentTime, dur: vid.duration }; store.set('cmx_prog', S.prog);
}
function closePlayer() {
  saveProg(); clearTimeout(hideT); clearInterval(wmT); locked = false; if (hls) { hls.destroy(); hls = null; } if (vid) { vid.pause(); vid.removeAttribute('src'); vid.load(); }
  $('#player').classList.remove('show'); $('#player').innerHTML = ''; if (document.fullscreenElement) document.exitFullscreen();
  if ($('#detail').classList.contains('show') && curSeries && !curSeries.movie) epList(); else render();
}

/* ═══════════ الأحداث ═══════════ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-grp],[data-cat],[data-open],[data-play],[data-close],[data-fav],[data-season],[data-ep]'); if (!t) return;
  const d = t.dataset;
  if (d.tab) { S.tab = d.tab; S.cat = null; S.grp = null; S.fg = null; S.fy = null; S.fs = 0; render(); scrollTo(0, 0); }
  else if (d.grp !== undefined && t.classList.contains('gtab')) { S.grp = d.grp || null; S.fg = null; S.fy = null; render(); }
  else if (d.cat !== undefined && t.classList.contains('chip') && !t.closest('#seasons')) { S.cat = d.cat === '' ? null : +d.cat; render(); }
  else if (d.season) { curSeason = +d.season; document.querySelectorAll('#seasons .chip').forEach(c => c.classList.toggle('on', c.dataset.season === d.season)); epList(); }
  else if (d.open) openDetail(+d.open);
  else if (d.play) play(+d.play);
  else if (d.ep) play(curSeries.id, +d.ep);
  else if (d.close) $('#' + d.close).classList.remove('show');
  else if (d.fav) { const id = +d.fav, i = S.favs.indexOf(id); i < 0 ? S.favs.push(id) : S.favs.splice(i, 1); store.set('cmx_favs', S.favs); t.innerHTML = i < 0 ? ic('heart') + ' في المفضلة' : ic('heartO') + ' أضف للمفضلة'; render(); }
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.flt; if (!k) return; const v = e.target.value;
  if (k === 'fs') S.fs = +v || 0; else if (k === 'cat') S.cat = v === '' ? null : +v; else S[k] = v || null;
  render();
});
let qt; $('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value; render(); }, 200); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#player').classList.contains('show')) closePlayer(); else $('#detail').classList.remove('show'); } });

/* ═══════════ حماية الواجهة (ردع للمتصفح فقط — لا تغني عن حماية الخادم) ═══════════ */
(function () {
  const dw = document.createElement('div'); dw.id = 'devwarn'; dw.textContent = 'أغلق أدوات المطوّر للمتابعة'; document.body.appendChild(dw);
  const ok = t => t && t.closest && t.closest('input,textarea');
  document.addEventListener('contextmenu', e => { if (!ok(e.target)) e.preventDefault(); });
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('selectstart', e => { if (!ok(e.target)) e.preventDefault(); });
  document.addEventListener('copy', e => { if (!ok(e.target)) e.preventDefault(); });
  document.addEventListener('keydown', e => {
    const k = (e.key || '').toLowerCase();
    if (e.key === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && 'ijc'.includes(k)) || ((e.ctrlKey || e.metaKey) && (k === 'u' || k === 's'))) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  /* كشف نافذة أدوات المطوّر المفتوحة (على أجهزة سطح المكتب فقط، لتجنّب الإنذار الخاطئ في الجوال) */
  const desk = !('ontouchstart' in window) && !/Android|iP(hone|ad|od)/i.test(navigator.userAgent);
  let open = false;
  if (desk) setInterval(() => {
    const o = (outerWidth - innerWidth > 220) || (outerHeight - innerHeight > 260);
    if (o && !open) { open = true; markSus(); dw.style.display = 'flex'; }
    else if (!o && open) { open = false; dw.style.display = 'none'; }
  }, 1200);
})();

loadData().then(() => { render(); loadViews(); }).catch(err => { $('#app').innerHTML = `<p class="empty">${esc(err.message)}<br><br><button class="btn" onclick="location.reload()">إعادة المحاولة</button></p>`; });
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
</body>
